# Execução completa: `docker compose up --build -d` (ou `make up`)
x-app: &app
  build: .  # sem `image:` fixo: 5 serviços gravando a mesma tag em paralelo dá conflito no build
  restart: unless-stopped

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fraudazero
      POSTGRES_PASSWORD: fraudazero
      POSTGRES_DB: fraudazero
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudazero -d fraudazero"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mlflow:
    <<: *app
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql://fraudazero:fraudazero@postgres:5432/mlflow
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
    ports: ["5001:5000"]
    volumes:
      - ./mlruns:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  airflow:
    build: ./docker/airflow
    image: fraudazero-airflow:latest
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com;
        airflow scheduler & exec airflow webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fraudazero:fraudazero@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: fraudazero-dev-secret
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports: ["8080:8080"]
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/project/src
      - ./data:/opt/project/data
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    restart: unless-stopped

  api:
    <<: *app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      FRAUD_THRESHOLD: ${FRAUD_THRESHOLD:-0.5}
    ports: ["8000:8000"]
    depends_on:
      - mlflow

  subscriber:
    <<: *app
    command: python -m subscriber.main
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      api:
        condition: service_started

  simulator:
    <<: *app
    command: python -m embedded.simulator
    environment:
      SIM_INTERVAL_S: ${SIM_INTERVAL_S:-0.5}
    volumes:
      - ./data:/app/data
    depends_on:
      - mosquitto

  dashboard:
    <<: *app
    command: streamlit run app/dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports: ["8501:8501"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
